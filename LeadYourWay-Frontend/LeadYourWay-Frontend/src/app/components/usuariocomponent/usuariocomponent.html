<div class="container">
  <mat-toolbar class="custom-toolbar">
    <button
      matButton
      class="btn-rojo"
      aria-label="Example icon-button with menu icon"
      [matMenuTriggerFor]="menuUsuario"
    >
      <mat-icon>menu</mat-icon>Usuario
    </button>
  </mat-toolbar>

  <mat-menu #menuUsuario="matMenu">
    <button mat-menu-item routerLink="/usuario">Listar</button>
    <button mat-menu-item routerLink="/usuario/news">Registrar</button>
  </mat-menu>
</div>
